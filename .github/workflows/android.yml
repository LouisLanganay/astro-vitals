name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: [self-hosted, astro]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-core
          cache-directories: target/mobile-core

      - uses: android-actions/setup-android@v3

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the core
        run: ./scripts/build-core.sh

      - name: Type check
        run: bunx tsc --noEmit

      - name: Engine test
        run: bun test

      - name: Prebuild
        run: bunx expo prebuild -p android --no-install --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs=-Xmx4g \
            --no-daemon

      - name: Name the APK
        run: |
          version=$(node -p "require('./app.json').expo.version")
          mkdir -p ../dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "../dist-apk/astro-vitals-${version}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: astro-vitals-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          body_path: mobile/RELEASE.md
          generate_release_notes: true
