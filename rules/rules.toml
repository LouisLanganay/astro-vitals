kind = "red_flag"
level = "flight_surgeon"
action = "Stop your task. Tell the Crew Medical Officer immediately. Export the summary packet for the flight surgeon."
explanation = "Swelling on one side of the neck or face is a red flag. A blood clot in a neck vein is a possible cause. It needs a medical assessment immediately."
body_region = "neck"
