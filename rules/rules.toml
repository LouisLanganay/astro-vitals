kind = "red_flag"
level = "flight_surgeon"
action = "Drink water. Tell the Crew Medical Officer immediately. Export the summary packet for the flight surgeon."
explanation = "Blood in the urine is a red flag. A kidney stone is a possible cause. It needs a medical assessment immediately."
body_region = "abdomen"
source = "https://www.nasa.gov/ochmo-mtb-003-urinary-health-2/"

[[rules]]
id = "red_flag_one_sided_swelling"
